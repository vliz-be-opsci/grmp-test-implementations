services:
  rttest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rt-test
    volumes:
      - ./reports:/reports:rw
      - ./example_config.yaml:/app/config.yaml:ro
    environment:
      - TS_NAME=localtestrun
      - TEST_CONFIG_PATH=/app/config.yaml
    working_dir: /app
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
